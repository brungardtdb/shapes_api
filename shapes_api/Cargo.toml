[package]
name = "shapes_api"
version = "0.1.0"
edition = "2024"

[dependencies]
shapes = { path = "../shapes" }
shape_repositories = {path = "../shape_repositories"}
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "postgres" ] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"]  }